[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ops-rag-knowledge"
version = "0.1.0"
description = "RAG-Anything + CrewAI multimodal operations knowledge base"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai>=0.130",
  "openai>=1.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "raganything>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.8"]

[project.scripts]
ops-rag = "ops_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
